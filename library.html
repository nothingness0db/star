<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>句子库</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="#ff6b35"/>
          <path d="M11.5 21.5c-1.9 0-3.3-1.4-3.3-3.4 0-3 2.3-5.7 5.8-6.8l.8 1.9c-1.9.8-3.1 2-3.4 3.2.3-.1.7-.2 1.1-.2 1.6 0 2.8 1.1 2.8 2.6 0 1.6-1.4 2.7-3.8 2.7z" fill="#fff"/>
          <path d="M22 21.5c-1.9 0-3.3-1.4-3.3-3.4 0-3 2.3-5.7 5.8-6.8l.8 1.9c-1.9.8-3.1 2-3.4 3.2.3-.1.7-.2 1.1-.2 1.6 0 2.8 1.1 2.8 2.6 0 1.6-1.4 2.7-3.8 2.7z" fill="#fff" opacity=".85"/>
        </svg>
        <div class="brand-text">
          <h1>句子库</h1>
          <p id="totalCount" class="total">共 0 条</p>
        </div>
      </div>
      <div class="toolbar" role="group" aria-label="句子库操作">
        <button id="importBtn" class="btn" type="button">导入 JSON</button>
        <button id="exportMdBtn" class="btn" type="button">导出 Markdown</button>
        <button id="exportJsonBtn" class="btn" type="button">导出 JSON</button>
        <button id="settingsBtn" class="btn" type="button">设置</button>
        <button id="clearBtn" class="btn danger" type="button">清空全部</button>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div class="search">
      <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="m13.2 13.2 3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索正文、标题、网址、梗 id…" autocomplete="off" spellcheck="false" aria-label="搜索句子">
      <span id="resultCount" class="result-count" aria-live="polite"></span>
    </div>

    <div class="meme-bar">
      <div class="meme-status">
        <span class="meme-dot" aria-hidden="true"></span>
        <span id="memeInfo" class="meme-info" aria-live="polite">梗库尚未下载</span>
      </div>
      <div class="meme-actions">
        <button id="onlyMemesBtn" class="btn toggle" type="button" aria-pressed="false">只看梗</button>
        <button id="refreshMemesBtn" class="btn" type="button">更新梗库</button>
      </div>
    </div>

    <section id="list" class="list" aria-label="收藏的句子"></section>

    <div id="emptyState" class="empty" hidden>
      <svg class="empty-icon" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2" opacity=".15"/>
        <path d="M26 41.5c-4 0-7-3-7-7 0-6.5 4.5-11.6 11-13.8l1.7 3.6c-3.6 1.5-6 3.6-6.7 6 .7-.2 1.5-.3 2.3-.3 3.3 0 5.7 2.4 5.7 5.5 0 3.4-2.7 6-7 6z" fill="currentColor" opacity=".3"/>
        <path d="M45 41.5c-4 0-7-3-7-7 0-6.5 4.5-11.6 11-13.8l1.7 3.6c-3.6 1.5-6 3.6-6.7 6 .7-.2 1.5-.3 2.3-.3 3.3 0 5.7 2.4 5.7 5.5 0 3.4-2.7 6-7 6z" fill="currentColor" opacity=".3"/>
      </svg>
      <p class="empty-title">句子库还是空的</p>
      <p class="empty-text">在任意网页选中文字，右键即可收藏。</p>
      <p class="empty-hint">收藏后可以在这里搜索、复制、导出备份。</p>
    </div>

    <div id="noResults" class="empty no-results" hidden>
      <p class="empty-title">没有匹配的句子</p>
      <p class="empty-text" id="noResultsText"></p>
    </div>
  </main>

  <footer class="wrap foot">数据只保存在这台设备的浏览器里，不会上传。</footer>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <a class="card-title" target="_blank" rel="noopener noreferrer"></a>
        <span class="card-time"></span>
      </div>
      <div class="card-source">
        <a class="card-domain" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="card-meme" hidden>
        <span class="meme-badge"></span>
        <span class="meme-hot"></span>
        <span class="meme-tags"></span>
      </div>
      <p class="card-text"></p>
      <div class="card-actions">
        <button class="link-btn expand-btn" type="button" hidden>展开</button>
        <span class="spacer"></span>
        <button class="link-btn copy-btn" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
            <rect x="7" y="7" width="9" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13 6V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h1" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="label">复制</span>
        </button>
        <button class="link-btn delete-btn" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
            <path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6m-6 0 .7 9a1.5 1.5 0 0 0 1.5 1.4h3.6a1.5 1.5 0 0 0 1.5-1.4L14 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="label">删除</span>
        </button>
      </div>
    </article>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirmDialog" class="dialog" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">清空句子库？</h2>
    <p>这会删除全部 <strong id="confirmCount">0</strong> 条收藏，且无法恢复。建议先导出一份备份。</p>
    <div class="dialog-actions">
      <button id="confirmCancel" class="btn" type="button">取消</button>
      <button id="confirmOk" class="btn danger-solid" type="button">清空</button>
    </div>
  </dialog>

  <dialog id="settingsDialog" class="dialog settings-dialog" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">设置</h2>
    <section class="setting-block">
      <h3>站内收藏（可选）</h3>
      <p>在 <strong>sb6657.cn</strong> 的梗列表旁显示一个星标按钮，点一下就能把这条梗存进句子库。不开启也不影响右键收藏等其它功能。</p>
      <p id="sitePermStatus" class="setting-status">当前状态：未启用</p>
      <div class="dialog-actions setting-actions">
        <button id="sitePermBtn" class="btn" type="button">在 6657 启用站内收藏</button>
        <button id="sitePermRemoveBtn" class="btn danger" type="button" hidden>关闭站内收藏</button>
      </div>
    </section>
    <div class="dialog-actions">
      <button id="settingsClose" class="btn" type="button">关闭</button>
    </div>
  </dialog>

  <input id="importInput" type="file" accept=".json,application/json" hidden>

  <script src="lib/store.js"></script>
  <script src="lib/memes.js"></script>
  <script src="library.js"></script>
</body>
</html>
