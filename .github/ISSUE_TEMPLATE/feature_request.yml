name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景和目前的痛点。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 希望扩展怎么 behaving；可以写具体操作流程。
    validations:
      required: true
  - type: dropdown
    id: firefox-version
    attributes:
      label: Firefox 版本
      options:
        - "140+"
        - Nightly
        - 其他/不确定
    validations:
      required: true
  - type: dropdown
    id: install-mode
    attributes:
      label: 是否临时加载
      options:
        - 临时加载（about:debugging）
        - 永久安装（xpi）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充
      description: 其它你想过的方式、截图说明等（可选）。
