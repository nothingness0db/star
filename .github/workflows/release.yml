name: Release

# 方案 B：CI 只出「未签名」构建产物，不再调用 AMO 签名。
# 原因：add-on 已以 listed 渠道上架（star@nothingness0db），
# 同一 ID 无法再用其他渠道签名；上架/更新统一在 AMO Developer Hub 手动完成。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm i -g web-ext

      - name: Resolve version
        id: meta
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "manifest version: $version"

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          expected = tag[1:]
          if manifest.get("version") != expected or pkg.get("version") != expected:
              print(
                  f"tag {tag} does not match manifest.json ({manifest.get('version')}) "
                  f"or package.json ({pkg.get('version')}). "
                  f"Update both files to {expected} before tagging.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"tag {tag} matched version {expected}")
          PY

      - name: Build unsigned zip
        run: web-ext build --source-dir . --overwrite-dest --filename "star-${{ steps.meta.outputs.version }}.zip"

      - name: Generate SHA256SUMS.txt
        run: |
          cd web-ext-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/SHA256SUMS.txt
          body: |
            ## 版本 ${{ steps.meta.outputs.tag }}

            本扩展已在 AMO 上架（listed，ID `star@nothingness0db`）。
            发布与更新统一走 AMO Developer Hub，**CI 不再签名**——listed 条目的签名由 AMO 在审核通过后自行完成。

            ### 附件
            - `star-${{ steps.meta.outputs.version }}.zip` —— 未签名构建产物；内容即完整源码（零构建步骤），也是上架 AMO 时使用的同一个包。
            - `SHA256SUMS.txt` —— 校验和，`sha256sum -c SHA256SUMS.txt` 核对。

            ### 安装 / 更新
            在 [AMO 详情页](https://addons.mozilla.org/firefox/addon/6657-star/) 点「添加到 Firefox」；
            已安装的用户会随审核通过自动更新。
          generate_release_notes: true
          fail_on_unmatched_files: false
