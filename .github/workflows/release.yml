name: Release

# 自托管分发：打 v* tag 时用 AMO API 以 unlisted 渠道签名，
# 把签名 XPI 上传到 GitHub Release，并把 updates.json 提交回 main。
# Firefox 通过 manifest.json 的 update_url 从 main 上的 updates.json 自动更新。
# 不再向 AMO listed 渠道提交新版本。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm i -g web-ext

      - name: Check AMO API keys
        run: |
          missing=0
          if [ -z "${AMO_JWT_ISSUER:-}" ]; then
            echo "::error::缺少 Secret AMO_JWT_ISSUER"
            missing=1
          fi
          if [ -z "${AMO_JWT_SECRET:-}" ]; then
            echo "::error::缺少 Secret AMO_JWT_SECRET"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "请在 Settings → Secrets and variables → Actions 配置 AMO API keys（AMO_JWT_ISSUER、AMO_JWT_SECRET）。" >&2
            exit 1
          fi
          echo "AMO API keys present."

      - name: Validate tag version
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          expected = tag[1:]
          if manifest.get("version") != expected or pkg.get("version") != expected:
              print(
                  f"tag {tag} does not match manifest.json ({manifest.get('version')}) "
                  f"or package.json ({pkg.get('version')}). "
                  f"Update both files to {expected} before tagging.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"tag {tag} matched version {expected}")
          PY

      - name: Resolve version
        id: meta
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest version: $version"

      - name: Build unsigned zip
        run: web-ext build --source-dir . --overwrite-dest --filename "star-${{ steps.meta.outputs.version }}.zip"

      - name: Sign with AMO (unlisted)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if ! web-ext sign --source-dir . --artifacts-dir web-ext-artifacts \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"; then
            echo "::error::AMO unlisted 签名失败。请检查 AMO_JWT_ISSUER / AMO_JWT_SECRET 是否正确，并确认 AMO 接受 star@nothingness0db 的 unlisted 签名。"
            exit 1
          fi
          signed=$(find web-ext-artifacts -maxdepth 1 -type f -name '*.xpi' -print -quit)
          if [ -z "$signed" ]; then
            echo "::error::web-ext sign 成功返回，但 web-ext-artifacts 中没有签名 XPI。"
            exit 1
          fi
          target="web-ext-artifacts/star-${VERSION}.xpi"
          if [ "$signed" != "$target" ]; then
            mv "$signed" "$target"
          fi
          rm -f web-ext-artifacts/*.zip
          ls -l web-ext-artifacts

      - name: Generate SHA256SUMS.txt
        run: |
          cd web-ext-artifacts
          sha256sum "star-${{ steps.meta.outputs.version }}.xpi" | tee SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: star ${{ steps.meta.outputs.version }}
          files: |
            web-ext-artifacts/star-${{ steps.meta.outputs.version }}.xpi
            web-ext-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## star ${{ steps.meta.outputs.version }}

            使用 AMO 以 **unlisted** 渠道签名，通过 GitHub Release + `updates.json` 自托管分发。

            ### 安装
            1. 下载 `star-${{ steps.meta.outputs.version }}.xpi`。
            2. Firefox 打开 `about:addons` → 齿轮菜单 → 「从文件安装附加组件…」→ 选择该文件。
            3. 已安装旧版的用户可直接覆盖安装，收藏数据保留。

            校验：

            ```sh
            sha256sum -c SHA256SUMS.txt
            ```

            ### 自动更新
            Firefox 会依据 `manifest.json` 的 `update_url`
            （`https://raw.githubusercontent.com/nothingness0db/star/main/updates.json`）自动检查更新，
            默认约每 24 小时一次；也可在扩展「设置 → 更新」里手动检查。

      - name: Commit updates.json to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/write-updates.mjs \
            --version "${{ steps.meta.outputs.version }}" \
            --xpi "web-ext-artifacts/star-${{ steps.meta.outputs.version }}.xpi" \
            --output updates.json
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json 已是最新，无需提交。"
            exit 0
          fi
          git commit -m "chore: update updates.json for v${{ steps.meta.outputs.version }} [skip ci]"
          git push origin main

      - name: Remove AMO upload cache
        if: always()
        run: rm -f .amo-upload-uuid
