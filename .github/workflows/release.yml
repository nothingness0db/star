name: Release

# 打 v* tag 时构建 unsigned zip，并用 AMO API 以 listed 渠道提交新版本。
# 更新由 Firefox 通过 AMO 商店完成；不再做 unlisted 签名、不生成 updates.json，
# 也不把 GitHub Release 当作更新源。
# listed 版本可能需要 AMO 人工审核：提交成功但仍在审核时按成功报告，不伪造已上架。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm i -g web-ext

      - name: Check AMO API keys
        run: |
          missing=0
          if [ -z "${AMO_JWT_ISSUER:-}" ]; then
            echo "::error::缺少 Secret AMO_JWT_ISSUER"
            missing=1
          fi
          if [ -z "${AMO_JWT_SECRET:-}" ]; then
            echo "::error::缺少 Secret AMO_JWT_SECRET"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "请在 Settings → Secrets and variables → Actions 配置 AMO API keys（AMO_JWT_ISSUER、AMO_JWT_SECRET）。" >&2
            exit 1
          fi
          echo "AMO API keys present."

      - name: Validate tag version
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          expected = tag[1:]
          if manifest.get("version") != expected or pkg.get("version") != expected:
              print(
                  f"tag {tag} does not match manifest.json ({manifest.get('version')}) "
                  f"or package.json ({pkg.get('version')}). "
                  f"Update both files to {expected} before tagging.",
                  file=sys.stderr,
              )
              sys.exit(1)
          gecko = manifest.get("browser_specific_settings", {}).get("gecko", {})
          if "update_url" in gecko:
              print("manifest must not declare update_url for the AMO listed build.", file=sys.stderr)
              sys.exit(1)
          print(f"tag {tag} matched version {expected}; no update_url")
          PY

      - name: Resolve version
        id: meta
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest version: $version"

      - name: Build unsigned zip
        run: web-ext build --source-dir . --overwrite-dest --filename "star-${{ steps.meta.outputs.version }}.zip"

      - name: Verify build output
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, sys, zipfile
          version = os.environ["VERSION"]
          path = f"web-ext-artifacts/star-{version}.zip"
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              manifest = json.loads(archive.read("manifest.json"))
          gecko = manifest.get("browser_specific_settings", {}).get("gecko", {})
          if manifest.get("version") != version:
              print(f"built manifest version {manifest.get('version')} != {version}", file=sys.stderr)
              sys.exit(1)
          if "update_url" in gecko:
              print("built manifest still contains update_url", file=sys.stderr)
              sys.exit(1)
          forbidden = [
              name for name in names
              if name.startswith(("scripts/", "docs/", ".github/"))
              or name in {"updates.json", "package.json", "package-lock.json", "README.md", "CHANGELOG.md", "CONTRIBUTING.md"}
          ]
          if forbidden:
              print(f"build contains files that should be excluded: {forbidden}", file=sys.stderr)
              sys.exit(1)
          print(f"build OK: {path} ({len(names)} files, no update_url)")
          PY

      - name: Submit to AMO (listed)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/submit-amo.mjs \
            --xpi "web-ext-artifacts/star-$VERSION.zip" \
            --version "$VERSION" \
            --channel listed \
            --addon-id "star@nothingness0db" \
            --addon-slug "6657-star"

      - name: Report submission failure
        if: failure()
        run: |
          echo "::error::AMO listed 提交失败；unsigned zip 已作为 artifact 保留，可手动上传 https://addons.mozilla.org/en-US/developers/addon/6657-star/versions/"
          echo "不要拿 unsigned zip 冒充商店签名版，也不要换用其他 add-on ID 重试。"

      - name: Upload unsigned zip for manual fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-${{ steps.meta.outputs.version }}-unsigned
          path: web-ext-artifacts/star-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: warn
          retention-days: 7
