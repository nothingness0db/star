name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'AMO signing channel'
        required: true
        default: unlisted
        type: choice
        options:
          - unlisted
          - listed

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm i -g web-ext

      - name: Resolve signing channel
        id: channel
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          channel="${{ github.event.inputs.channel || 'unlisted' }}"
          case "$channel" in
            listed|unlisted) ;;
            *) echo "Invalid channel: $channel" >&2; exit 1 ;;
          esac
          echo "value=$channel" >> "$GITHUB_OUTPUT"

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          expected = tag[1:]  # strip leading 'v'
          if manifest.get("version") != expected or pkg.get("version") != expected:
              print(
                  f"tag {tag} does not match manifest.json ({manifest.get('version')}) "
                  f"or package.json ({pkg.get('version')}). "
                  f"Update both files to {expected} before tagging.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"tag {tag} matched version {expected}")
          PY

      - name: Check AMO API keys
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "请在 Settings → Secrets 配置 AMO API keys" >&2
            exit 1
          fi
          echo "AMO API keys configured"

      - name: Build unsigned zip
        run: web-ext build --source-dir . --overwrite-dest --filename "star.zip"

      - name: Sign with AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign --source-dir . --channel "${{ steps.channel.outputs.value }}" --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --timeout 300000 --approval-timeout 300000

      - name: Generate SHA256SUMS.txt
        run: |
          cd web-ext-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt


      - name: Ensure release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(python3 -c "import json;print(json.load(open('manifest.json',encoding='utf-8'))['version'])")
            tag="v"$version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -fa "$tag" -m "Release $tag"
            git push origin "$tag" --force
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.channel.outputs.version) || github.ref_name }}
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/*.xpi
            web-ext-artifacts/SHA256SUMS.txt
          body: |
            ## 版本 ${{ github.ref_name }}

            签名频道：`${{ steps.channel.outputs.value }}`

            ### 安装
            1. 下载下方的 `.xpi`（已由 AMO 签名）。
            2. 在 Firefox 中打开 `about:addons` → 齿轮菜单 → 「从文件安装附加组件…」→ 选择 `.xpi`。
            3. 如需校验文件完整性，下载 `SHA256SUMS.txt`，用 `sha256sum -c SHA256SUMS.txt` 核对。
            4. 未签名的 `.zip` 供检查源码/手动打包使用，也可临时载入 `manifest.json`。

            > 若频道为 **listed**，AMO 会进入人工审核队列，可能延迟数天才出现签名 xpi；
            > 这期间 Release 中的 `.xpi` 可能尚未生成或尚未签名。需要立即可用时请选 `unlisted`。
          generate_release_notes: true
          fail_on_unmatched_files: false
