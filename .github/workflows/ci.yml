name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm i -g web-ext

      - name: Lint extension (errors fail, warnings printed)
        run: |
          set -o pipefail
          web-ext lint --source-dir . --self-hosted --output json --pretty > /tmp/web-ext-lint.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/web-ext-lint.json", encoding="utf-8") as f:
              report = json.load(f)
          errors = report.get("errors", [])
          warnings = report.get("warnings", [])
          for w in warnings:
              print(f"warning: {w.get('message', '')}")
          if errors:
              for e in errors:
                  print(f"error: {e.get('message', '')}", file=sys.stderr)
              sys.exit(1)
          print(f"web-ext lint: {len(errors)} errors, {len(warnings)} warnings")
          PY

      - name: Syntax check JavaScript
        run: |
          for f in background.js library.js lib/*.js content/*.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: npm test

      - name: Validate manifest and version consistency
        run: |
          python3 - <<'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          if manifest.get("version") != pkg.get("version"):
              print(
                  f"version mismatch: manifest.json={manifest.get('version')} "
                  f"package.json={pkg.get('version')}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"manifest.json OK, version {manifest['version']}")
          PY

      - name: Validate self-hosted update config
        run: |
          python3 - <<'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          gecko = manifest.get("browser_specific_settings", {}).get("gecko", {})
          expected = "https://raw.githubusercontent.com/nothingness0db/star/main/updates.json"
          if gecko.get("update_url") != expected:
              print(
                  f"manifest update_url mismatch: {gecko.get('update_url')!r}, expected {expected!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          with open("updates.json", encoding="utf-8") as f:
              updates = json.load(f)
          addon = updates.get("addons", {}).get(gecko.get("id"))
          if not addon or not isinstance(addon.get("updates"), list) or not addon["updates"]:
              print("updates.json is missing addons.<id>.updates", file=sys.stderr)
              sys.exit(1)
          latest = addon["updates"][-1]
          if not latest.get("version") or not latest.get("update_link"):
              print("updates.json entry needs version and update_link", file=sys.stderr)
              sys.exit(1)
          print(f"updates.json OK: {gecko['id']} -> {latest['version']}")
          PY


      - name: Build extension
        run: web-ext build --source-dir . --overwrite-dest --filename "star.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: web-ext-artifacts/*.zip
          retention-days: 7
