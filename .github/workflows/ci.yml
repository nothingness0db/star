name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm i -g web-ext

      - name: Lint extension (errors fail, warnings printed)
        run: |
          set -o pipefail
          web-ext lint --source-dir . --output json --pretty > /tmp/web-ext-lint.json
          python3 - <<'PY'
          import json, sys
          with open("/tmp/web-ext-lint.json", encoding="utf-8") as f:
              report = json.load(f)
          errors = report.get("errors", [])
          warnings = report.get("warnings", [])
          for w in warnings:
              print(f"warning: {w.get('message', '')}")
          if errors:
              for e in errors:
                  print(f"error: {e.get('message', '')}", file=sys.stderr)
              sys.exit(1)
          print(f"web-ext lint: {len(errors)} errors, {len(warnings)} warnings")
          PY

      - name: Syntax check JavaScript
        run: |
          for f in background.js library.js lib/*.js content/*.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: Run unit tests
        run: npm test

      - name: Validate manifest and version consistency
        run: |
          python3 - <<'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          if manifest.get("version") != pkg.get("version"):
              print(
                  f"version mismatch: manifest.json={manifest.get('version')} "
                  f"package.json={pkg.get('version')}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"manifest.json OK, version {manifest['version']}")
          PY

      - name: Validate AMO listed update config
        run: |
          python3 - <<'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          gecko = manifest.get("browser_specific_settings", {}).get("gecko", {})
          if "update_url" in gecko:
              print(
                  "manifest must not declare update_url for the AMO listed build; "
                  "Firefox should check for updates through AMO",
                  file=sys.stderr,
              )
              sys.exit(1)
          host_permissions = manifest.get("host_permissions", [])
          if "https://api.github.com/*" not in host_permissions:
              print(
                  "host_permissions must keep https://api.github.com/* for GitHub Gist backup",
                  file=sys.stderr,
              )
              sys.exit(1)
          optional = manifest.get("optional_host_permissions", [])
          if "https://*/*" not in optional:
              print(
                  "optional_host_permissions must keep https://*/* so WebDAV origins can be requested",
                  file=sys.stderr,
              )
              sys.exit(1)
          background_scripts = manifest.get("background", {}).get("scripts", [])
          if "lib/webdav.js" not in background_scripts:
              print(
                  "background.scripts must include lib/webdav.js for WebDAV backup",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"AMO listed config OK: {gecko.get('id')} v{manifest['version']} (no update_url)")
          PY


      - name: Build extension
        run: web-ext build --source-dir . --overwrite-dest --filename "star.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: web-ext-artifacts/*.zip
          retention-days: 7
