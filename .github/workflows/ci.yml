name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Guard workflow text integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          bad = ["puth", "pull_requett", "permittiont", "contentt", "actiont", "tetup", "-tource-dir", "jton", "mettage", "tha256tum", "vertion", "manifett", "releate", "tign", "tecret", "extention", "errort", "warningt", "filet", "optiont", "inputt", "tagt", "jobt", "ttept", "runt-on"]
          files = sorted(Path(".github/workflows").glob("*.yml"))
          found = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              for token in bad:
                  if token in text:
                      found.append(f"{path}: contains corrupted token {token!r}")
          if found:
              print("\n".join(found), file=sys.stderr)
              sys.exit(1)
          print(f"workflow text integrity OK: {len(files)} file(s)")
          PY

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Lint extension (errors fail, warnings printed)
        run: |
          set -o pipefail
          web-ext lint --source-dir . --output json --pretty > web-ext-lint.json
          python3 - <<'PY'
          import json, sys
          with open("web-ext-lint.json", encoding="utf-8") as f:
              report = json.load(f)
          errors = report.get("errors", [])
          warnings = report.get("warnings", [])
          for w in warnings:
              print(f"warning: {w.get('message', '')}")
          if errors:
              for e in errors:
                  print(f"error: {e.get('message', '')}", file=sys.stderr)
              sys.exit(1)
          print(f"web-ext lint: {len(errors)} errors, {len(warnings)} warnings")
          PY

      - name: Syntax check JavaScript
        run: |
          for f in background.js library.js lib/*.js content/*.js; do
            node --check "$f"
          done

      - name: Validate manifest and version consistency
        run: |
          python3 - <<'PY'
          import json, sys
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          if manifest.get("version") != pkg.get("version"):
              print(
                  f"version mismatch: manifest.json={manifest.get('version')} "
                  f"package.json={pkg.get('version')}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"manifest.json OK, version {manifest['version']}")
          PY

      - name: Build extension
        run: web-ext build --source-dir . --overwrite-dest --filename "6657star.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: web-ext-artifacts/*.zip
          retention-days: 7

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'AMO signing channel'
        required: true
        default: unlisted
        type: choice
        options:
          - unlisted
          - listed

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Resolve signing channel
        id: channel
        run: |
          channel="${{ github.event.inputs.channel || 'unlisted' }}"
          case "$channel" in
            listed|unlisted) ;;
            *) echo "Invalid channel: $channel" >&2; exit 1 ;;
          esac
          echo "value=$channel" >> "$GITHUB_OUTPUT"

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          expected = tag[1:]  # strip leading v
          if manifest.get("version") != expected or pkg.get("version") != expected:
              print(
                  f"tag {tag} does not match manifest.json ({manifest.get('version')}) "
                  f"or package.json ({pkg.get('version')}). "
                  f"Update both files to {expected} before tagging.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"tag {tag} matched version {expected}")
          PY

      - name: Check AMO API keys
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "请在 Settings → Secrets 配置 AMO API keys（AMO_JWT_ISSUER、AMO_JWT_SECRET）。" >&2
            exit 1
          fi
          echo "AMO API keys configured"

      - name: Build unsigned zip
        run: web-ext build --source-dir . --overwrite-dest --filename "6657star.zip"

      - name: Sign with AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign --source-dir . --channel "${{ steps.channel.outputs.value }}" --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"

      - name: Generate SHA256SUMS.txt
        run: |
          cd web-ext-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/*.xpi
            web-ext-artifacts/SHA256SUMS.txt
          body: |
            ## 版本 ${{ github.ref_name }}

            签名频道：`${{ steps.channel.outputs.value }}`

            ### 安装
            1. 下载下方的 `.xpi`（已由 AMO 签名）。
            2. 在 Firefox 中打开 `about:addons` → 齿轮菜单 → 「从文件安装附加组件…」→ 选择 `.xpi`。
            3. 如需校验文件完整性，下载 `SHA256SUMS.txt`，用 `sha256sum -c SHA256SUMS.txt` 核对。
            4. 未签名的 `.zip` 供检查源码/手动打包使用，也可临时载入 `manifest.json`。

            > 若频道为 **listed**，AMO 会进入人工审核队列，可能延迟数天才出现签名 xpi；
            > 这期间 Release 中的 `.xpi` 可能尚未生成或尚未签名。需要立即可用时请选 `unlisted`。
          generate_release_notes: true
          fail_on_unmatched_files: false
